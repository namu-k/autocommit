# autocommit 허용 목록. 공백 구분: 저장소 루트 / commit 허용 브랜치 / push 원격 / push 허용 브랜치(선택).
# '#' 이후는 주석입니다. '-'는 해당 자동 단계를 끕니다.
#
# 먼저 `autocommit plan`으로 판정만 확인한 뒤, herdr 안에서 `autocommit up`을 실행하세요.
# 원격 push는 fetch URL과 push URL이 같고 AC_REMOTE_ALLOW에 맞을 때만 시도됩니다.

# ~/workspace/my-private-repo   main   origin   main
# ~/workspace/local-notes       *      -
